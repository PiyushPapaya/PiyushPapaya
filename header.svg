<svg width="1200" height="260" viewBox="0 0 1200 260"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Piyush Nagpal: Chip design, machine learning, embedded systems. Electrical Engineering and IT at TUM, Munich" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <style>
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>

  <!-- background -->
  <rect width="1200" height="260" fill="#0d1117"/>

  <!-- seal ring: the outline of a die -->
  <rect x="20" y="20" width="1160" height="220" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  <rect x="28" y="28" width="1144" height="204" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>

  <!-- corner marks -->
  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M20 44V20H44"/>
    <path d="M1156 20H1180V44"/>
    <path d="M20 216V240H44"/>
    <path d="M1156 240H1180V216"/>
  </g>

  <!-- bond pads along top and bottom edge -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.14">
    <g id="pads-left">
      <rect x="100" y="36" width="10" height="10"/>
      <rect x="140" y="36" width="10" height="10"/>
      <rect x="180" y="36" width="10" height="10"/>
      <rect x="220" y="36" width="10" height="10"/>
      <rect x="260" y="36" width="10" height="10"/>
      <rect x="100" y="214" width="10" height="10"/>
      <rect x="140" y="214" width="10" height="10"/>
      <rect x="180" y="214" width="10" height="10"/>
      <rect x="220" y="214" width="10" height="10"/>
      <rect x="260" y="214" width="10" height="10"/>
    </g>
    <use href="#pads-left" transform="translate(1200 0) scale(-1 1)"/>
  </g>

  <!-- routed traces with 45 degree bends, ending in vias next to the name -->
  <g id="traces-left" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5">
    <path d="M105 46V88L137 120H312"/>
    <path d="M185 46V72L205 92H282"/>
    <path d="M105 214V172L137 140H312"/>
    <path d="M185 214V188L205 168H282"/>
    <g fill="#0d1117" stroke-opacity="0.35">
      <circle cx="315" cy="120" r="3"/>
      <circle cx="285" cy="92" r="3"/>
      <circle cx="315" cy="140" r="3"/>
      <circle cx="285" cy="168" r="3"/>
    </g>
  </g>
  <use href="#traces-left" transform="translate(1200 0) scale(-1 1)"/>

  <!-- one signal travelling from a pad into the die -->
  <path class="signal" d="M105 46V88L137 120H312"
    fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2"
    stroke-linecap="round" stroke-dasharray="36 1000" stroke-dashoffset="36">
    <animate attributeName="stroke-dashoffset"
      values="36;-300;-300" keyTimes="0;0.55;1" dur="5s" repeatCount="indefinite"/>
  </path>

  <!-- name -->
  <text x="600" y="118" text-anchor="middle"
    font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="64" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Piyush Nagpal</text>

  <!-- divider with via nodes at both ends -->
  <line x1="470" y1="142" x2="730" y2="142" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="465" y="139.5" width="5" height="5" fill="#ffffff" fill-opacity="0.4"/>
  <rect x="730" y="139.5" width="5" height="5" fill="#ffffff" fill-opacity="0.4"/>

  <!-- focus -->
  <text x="600" y="178" text-anchor="middle"
    font-family="'JetBrains Mono', Consolas, 'SF Mono', monospace"
    font-size="18" font-weight="500" letter-spacing="1.5" fill="#c9d1d9">Chip design / Machine learning / Embedded systems</text>

  <!-- where -->
  <text x="600" y="206" text-anchor="middle"
    font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="14" letter-spacing="0.5" fill="#8b949e">Electrical Engineering &amp; IT at TUM, Munich</text>

</svg>
